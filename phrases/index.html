<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Phrase Evidence | Immigration Social Media Archive</title>
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Phrase Evidence</h1>
        <p id="scope-line">Loading archive evidence...</p>
      </div>
      <nav>
        <a class="button secondary" href="../">Archive</a>
        <a class="button secondary" href="tweets.csv">Tweets CSV</a>
        <a class="button secondary" href="timeseries.csv">Daily CSV</a>
      </nav>
    </header>

    <main>
      <section class="summary-band" aria-labelledby="summary-title">
        <div class="section-heading">
          <div>
            <h2 id="summary-title">Unique tweet totals</h2>
            <p>Phrase and evidence-source totals overlap.</p>
          </div>
          <div class="total-readout">
            <span id="filtered-total">0</span>
            <small>matching tweets</small>
          </div>
        </div>
        <div class="summary-table-wrap">
          <table class="summary-table">
            <thead>
              <tr>
                <th scope="col">Phrase</th>
                <th scope="col">Total</th>
                <th scope="col" data-account="DHS">DHS</th>
                <th scope="col" data-account="ICE">ICE</th>
                <th scope="col" data-account="CBP">CBP</th>
                <th scope="col" data-account="White House">White House</th>
              </tr>
            </thead>
            <tbody id="summary-body"></tbody>
          </table>
        </div>
      </section>

      <section class="controls" aria-label="Report filters">
        <div class="control-row">
          <div class="segmented" id="phrase-filter" aria-label="Phrase family"></div>
        </div>
        <div class="control-row fields">
          <label>
            Account
            <select id="account-filter">
              <option value="">All accounts</option>
              <option value="DHS">DHS</option>
              <option value="ICE">ICE</option>
              <option value="CBP">CBP</option>
              <option value="White House">White House</option>
            </select>
          </label>
          <label>
            Evidence
            <select id="source-filter">
              <option value="">Any evidence</option>
              <option value="tweet-text">Post text</option>
              <option value="image-ocr">Image OCR</option>
              <option value="video-frame-ocr">Video-frame OCR</option>
              <option value="transcript">Transcript</option>
            </select>
          </label>
          <label>
            From
            <input id="date-from" type="date" />
          </label>
          <label>
            To
            <input id="date-to" type="date" />
          </label>
          <label class="search-label">
            Search results
            <input id="text-filter" type="search" placeholder="Text or handle" />
          </label>
          <button type="button" class="button reset" id="reset-filters">Reset</button>
        </div>
      </section>

      <section class="chart-section" aria-labelledby="chart-title">
        <div class="section-heading chart-heading">
          <div>
            <h2 id="chart-title">Daily hits</h2>
            <p id="chart-caption"></p>
          </div>
          <div class="segmented chart-grain" id="grain-filter" aria-label="Chart interval">
            <button type="button" data-value="day" aria-pressed="true">Day</button>
            <button type="button" data-value="week">Week</button>
            <button type="button" data-value="month">Month</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="timeline-chart" role="img" aria-label="Daily phrase hits over time"></canvas>
          <div class="chart-tooltip" id="chart-tooltip" hidden></div>
        </div>
        <div class="range-control" aria-label="Chart date range">
          <div class="range-values">
            <output id="range-start-label" for="range-start">2016-01-01</output>
            <button type="button" id="range-reset">Full range</button>
            <output id="range-end-label" for="range-end">2026-08-06</output>
          </div>
          <div class="dual-range">
            <div class="range-track" aria-hidden="true">
              <span id="range-selection"></span>
            </div>
            <input
              id="range-start"
              type="range"
              min="0"
              max="1"
              value="0"
              aria-label="Start date"
            />
            <input id="range-end" type="range" min="0" max="1" value="1" aria-label="End date" />
          </div>
        </div>
        <div class="legend" id="chart-legend"></div>
      </section>

      <section class="results-section" aria-labelledby="results-title">
        <div class="section-heading results-heading">
          <div>
            <h2 id="results-title">Matching tweets</h2>
            <p id="result-count"></p>
          </div>
          <label>
            Order
            <select id="sort-order">
              <option value="desc">Newest first</option>
              <option value="asc">Oldest first</option>
            </select>
          </label>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
        <div class="pager" id="pager"></div>
      </section>
    </main>

    <template id="tweet-template">
      <article class="tweet-row">
        <div class="tweet-meta"></div>
        <div class="tweet-tags"></div>
        <p class="tweet-text"></p>
        <div class="evidence-list"></div>
        <div class="tweet-actions"></div>
        <div class="media-area" hidden></div>
      </article>
    </template>

    <script type="module" src="app.js?v=5"></script>
  </body>
</html>
