name: Build X Login Pinger APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/x-login-pinger.yml'
      - 'tools/x-login-pinger/**'
  pull_request:
    paths:
      - '.github/workflows/x-login-pinger.yml'
      - 'tools/x-login-pinger/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build debug APK
        working-directory: tools/x-login-pinger
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-login-pinger-debug-apk
          path: tools/x-login-pinger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
